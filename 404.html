<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 · JD STUDIO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EFE9">
<link rel="icon" href="01-store-landing/assets/favicon-32.png" sizes="32x32">
<style>
@font-face{font-family:"Editorial Serif";font-style:normal;font-weight:400;font-display:swap;src:url("01-store-landing/assets/fonts/serif-regular.woff2") format("woff2")}
@font-face{font-family:"UI Sans";font-style:normal;font-weight:400;font-display:swap;src:url("01-store-landing/assets/fonts/sans-regular.woff2") format("woff2")}
@font-face{font-family:"Index Mono";font-style:normal;font-weight:400;font-display:swap;src:url("01-store-landing/assets/fonts/mono-regular.woff2") format("woff2")}
:root{--paper:#F2EFE9;--ink:#17140F;--muted:#6D6456;--line:rgba(23,20,15,.18);--serif:"Editorial Serif","Noto Serif KR",serif;--sans:"UI Sans","Pretendard",sans-serif;--mono:"Index Mono",monospace;--pad:clamp(20px,4.4vw,64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;overflow-x:clip}
.wrap{max-width:1408px;margin:0 auto;padding:clamp(120px,16vw,200px) var(--pad) 80px;min-height:100dvh;display:flex;flex-direction:column}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);padding-top:12px;border-top:1px solid var(--line);max-width:520px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5.4vw,72px);line-height:1.14;letter-spacing:-.03em;margin:28px 0 0;max-width:24ch;text-wrap:balance;word-break:keep-all}
p{margin:20px 0 0;max-width:44ch;color:var(--muted);font-size:15px;line-height:1.8}
a{display:inline-flex;align-items:center;gap:10px;margin-top:36px;padding:14px 20px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);text-decoration:none;font-size:14px;font-weight:600;width:fit-content;transition:transform .3s cubic-bezier(.22,1,.36,1),background .3s}
a:hover{transform:translateY(-2px);background:#9A4E2B;border-color:#9A4E2B}
.foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){a:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <p class="kick">404 · NOT FOUND</p>
  <h1>주소가 바뀌었거나, 페이지를 지웠습니다.</h1>
  <p>샘플 페이지로 돌아가서 세 업종을 다시 열어 보세요. 찾는 페이지가 분명하다면 메일로 알려 주시면 연결해 드립니다.</p>
  <a href="/jd-portfolio/">샘플로 돌아가기 <span aria-hidden="true">→</span></a>
  <div class="foot">
    <span>JD STUDIO · 구리 / 서울</span>
    <a href="mailto:mashiaro@naver.com" style="margin:0;padding:0;background:none;border:0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:400">mashiaro@naver.com</a>
  </div>
</div>
</body>
</html>
