<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원페이지 홈페이지 샘플 · 카페·식당 / 인테리어·설비 / 학원·공방</title>
<meta name="description" content="9.9만 원 원페이지 홈페이지 제작 샘플. 카페·식당, 인테리어·설비, 학원·공방 세 업종을 각각 다른 레이아웃으로 확인할 수 있습니다.">
<meta name="theme-color" content="#f6f2ea">
<meta property="og:type" content="website">
<meta property="og:title" content="원페이지 홈페이지 샘플 · 세 업종">
<meta property="og:description" content="카페·식당 / 인테리어·설비 / 학원·공방. 업종을 바꾸면 디자인 시스템과 레이아웃이 통째로 바뀝니다.">
<meta property="og:image" content="assets/cafe-hero.webp">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
@font-face{font-family:"Editorial Serif";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/serif-regular.woff2") format("woff2")}
@font-face{font-family:"UI Sans";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/sans-regular.woff2") format("woff2")}
@font-face{font-family:"UI Sans";font-style:normal;font-weight:500;font-display:swap;src:url("assets/fonts/sans-medium.woff2") format("woff2")}
@font-face{font-family:"UI Sans";font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/sans-semibold.woff2") format("woff2")}
@font-face{font-family:"UI Sans";font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/sans-bold.woff2") format("woff2")}
@font-face{font-family:"Index Mono";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/mono-regular.woff2") format("woff2")}

:root{--ease:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;overflow-x:clip;background:#f6f2ea;color:#17140f;font-family:"UI Sans",sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .45s var(--ease)}
body[data-ind="interior"]{background:#121417;color:#f2f0ec}
body[data-ind="clay"]{background:#fbfaf8;color:#1b1714}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p,figure,blockquote,dl,dd,figcaption{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
[hidden]{display:none!important}
.skip{position:fixed;left:-9999px;top:0;z-index:300;background:#111;color:#fff;padding:12px 16px;font-size:14px}
.skip:focus{left:12px;top:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.site{position:relative}
.site h1,.site h2,.site h3{font-weight:400}
.sw{display:flex;align-items:center}
.sw__t{position:relative;display:flex;align-items:baseline;gap:7px;white-space:nowrap;transition:color .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease)}
.sw__no{font-size:10px;letter-spacing:.06em;opacity:.55}
[data-rv]{opacity:0;transform:translateY(24px);transition:opacity .75s var(--ease),transform .75s var(--ease)}
[data-rv].on{opacity:1;transform:none}

/* =====================================================================
   01 · CAFE — editorial magazine on warm paper
   ===================================================================== */
.site--cafe{
  --paper:#f6f2ea;--paper2:#ece5d7;--ink:#17140f;--ink2:#3c372f;--muted:#6f6659;
  --line:rgba(23,20,15,.17);--line2:rgba(23,20,15,.08);--accent:#9a4e2b;
  --serif:"Editorial Serif",serif;--sans:"UI Sans",sans-serif;--mono:"Index Mono",monospace;
  --pad:clamp(20px,4.4vw,64px);--gut:clamp(15px,2.1vw,30px);--maxw:1360px;
  --bleed:max(var(--pad),calc((100vw - var(--maxw)) / 2 + var(--pad)));
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.62;word-break:keep-all;overflow-wrap:break-word
}
.site--cafe .cf-bar{position:fixed;z-index:60;top:14px;left:50%;transform:translateX(-50%);width:min(var(--maxw),calc(100% - 28px));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:9px 14px;border:1px solid var(--line2);background:rgba(246,242,234,.86);-webkit-backdrop-filter:blur(16px) saturate(1.04);backdrop-filter:blur(16px) saturate(1.04)}
.site--cafe .cf-mark{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.site--cafe .cf-mark__ko{font-family:var(--serif);font-size:17px;letter-spacing:-.01em}
.site--cafe .cf-mark__en{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.site--cafe .sw{justify-self:center;gap:2px}
.site--cafe .sw__t{padding:7px 12px;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:-.01em}
.site--cafe .sw__t::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.site--cafe .sw__t:hover{color:var(--ink2)}
.site--cafe .sw__t[aria-selected="true"]{color:var(--ink)}
.site--cafe .sw__t[aria-selected="true"]::after{transform:scaleX(1)}
.site--cafe .sw__t[aria-selected="true"] .sw__no{color:var(--accent);opacity:1}
.site--cafe .sw__s{display:none}
.site--cafe .cf-bar__meta{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.site--cafe .cf-bar__meta b{font-weight:400;color:var(--ink)}
.site--cafe .cf-bar__mail{border-bottom:1px solid var(--line2);padding-bottom:1px}
.site--cafe .cf-bar__mail:hover{border-color:var(--ink)}

.site--cafe .cf-issue{max-width:var(--maxw);margin:0 auto;padding:84px var(--pad) 0}
.site--cafe .cf-issue__in{display:flex;justify-content:space-between;gap:12px;padding-top:9px;border-top:1px solid var(--ink);font-family:var(--mono);font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
.site--cafe .cf-issue__in b{font-weight:400;color:var(--ink)}

.site--cafe .cf-hero{max-width:var(--maxw);margin:0 auto;padding:clamp(26px,4vw,52px) var(--pad) 0;display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);align-items:start}
.site--cafe .cf-hero__text{grid-column:1/7;padding-top:4px}
.site--cafe .cf-eyebrow{padding-top:11px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.15em;line-height:1.6;text-transform:uppercase;color:var(--muted)}
.site--cafe .cf-display{font-family:var(--serif);font-size:clamp(33px,4.2vw,58px);line-height:1.14;letter-spacing:-.03em;margin-top:26px;text-wrap:balance}
.site--cafe .cf-display span{display:block}
.site--cafe .cf-display em{font-style:normal;color:var(--accent)}
.site--cafe .cf-lede{margin-top:22px;max-width:42ch;font-size:15px;line-height:1.85;color:var(--ink2);text-wrap:pretty}
.site--cafe .cf-acts{display:flex;align-items:center;gap:22px;margin-top:30px;flex-wrap:wrap}
.site--cafe .cf-btn{display:inline-flex;align-items:center;gap:11px;padding:13px 19px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600;letter-spacing:-.01em;transition:background .3s var(--ease),transform .3s var(--ease)}
.site--cafe .cf-btn:hover{background:var(--accent);transform:translateY(-2px)}
.site--cafe .cf-btn:active{transform:translateY(0) scale(.99)}
.site--cafe .cf-btn i{font-family:var(--mono);font-style:normal;font-size:11px;opacity:.7}
.site--cafe .cf-link{display:inline-flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);padding-bottom:2px;font-size:14px;font-weight:500;transition:color .3s var(--ease),border-color .3s var(--ease)}
.site--cafe .cf-link:hover{color:var(--accent);border-color:var(--accent)}
.site--cafe .cf-note{margin-top:16px;font-size:12px;line-height:1.75;color:var(--muted);padding-left:13px;border-left:1px solid var(--line);max-width:46ch}
.site--cafe .cf-note a{color:var(--ink);border-bottom:1px solid var(--line)}
.site--cafe .cf-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gut);margin-top:38px;padding-top:13px;border-top:1px solid var(--line)}
.site--cafe .cf-facts .k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.site--cafe .cf-facts .v{display:block;margin-top:5px;font-size:13px;line-height:1.45;color:var(--ink2)}
.site--cafe .cf-hero__media{grid-column:7/13;margin-right:calc(var(--bleed) * -1);margin-top:clamp(22px,4.5vw,72px)}
.site--cafe .cf-media{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--paper2)}
.site--cafe .cf-media img,.site--cafe .cf-media canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.site--cafe .cf-media canvas{opacity:0;transition:opacity .8s var(--ease)}
.site--cafe .cf-media.is-live canvas{opacity:1}
.site--cafe .cf-cap{display:flex;justify-content:space-between;gap:16px;margin-top:11px;padding-top:9px;padding-right:var(--pad);border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);line-height:1.6}
.site--cafe .cf-cap span:last-child{text-align:right}

.site--cafe .cf-ticker{margin-top:clamp(36px,5vw,68px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding:9px 0}
.site--cafe .cf-ticker__in{display:flex;width:max-content;animation:cf-run 52s linear infinite}
.site--cafe .cf-ticker__grp{display:flex;gap:44px;padding-right:44px}
.site--cafe .cf-ticker span{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.site--cafe .cf-ticker span::after{content:" /";color:var(--line)}
@keyframes cf-run{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.site--cafe .cf-statement{max-width:var(--maxw);margin:0 auto;padding:clamp(70px,9vw,132px) var(--pad);display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:20px}
.site--cafe .cf-statement__kick{grid-column:1/4;padding-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
.site--cafe .cf-statement__text{grid-column:4/12;font-family:var(--serif);font-size:clamp(25px,3.4vw,45px);line-height:1.34;letter-spacing:-.028em;max-width:23ch;text-wrap:balance}
.site--cafe .cf-statement__text .w{opacity:.17;transition:opacity .6s var(--ease)}
.site--cafe .cf-statement__text .w.on{opacity:1}
.site--cafe .cf-statement__text .br{display:block}

.site--cafe .cf-sec{max-width:var(--maxw);margin:0 auto;padding:clamp(58px,6.5vw,88px) var(--pad);border-top:1px solid var(--line)}
.site--cafe .cf-head{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:14px;align-items:end;margin-bottom:clamp(28px,3.6vw,48px)}
.site--cafe .cf-head__no{grid-column:1/2;padding-bottom:5px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
.site--cafe .cf-head__title{grid-column:2/8;font-family:var(--serif);font-size:clamp(23px,2.8vw,37px);line-height:1.24;letter-spacing:-.028em;text-wrap:balance}
.site--cafe .cf-head__desc{grid-column:8/13;font-size:14px;line-height:1.78;color:var(--muted);max-width:44ch;text-wrap:pretty}

.site--cafe .cf-rows{border-top:1px solid var(--line2)}
.site--cafe .cf-row{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:10px;padding:30px 0;border-bottom:1px solid var(--line2);align-items:start}
.site--cafe .cf-row__no{grid-column:1/2;padding-top:5px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.site--cafe .cf-row__title{grid-column:2/5;font-family:var(--serif);font-size:clamp(18px,1.75vw,23px);line-height:1.36;letter-spacing:-.02em}
.site--cafe .cf-row__body{grid-column:5/9;font-size:14px;line-height:1.85;color:var(--ink2);text-wrap:pretty}
.site--cafe .cf-row--wide .cf-row__body{grid-column:5/11}
.site--cafe .cf-row__body strong{font-weight:500;color:var(--ink)}
.site--cafe .cf-row__media{grid-column:9/13;aspect-ratio:4/3;overflow:hidden;background:var(--paper2);margin-top:-6px}
.site--cafe .cf-row__media img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.site--cafe .cf-row:hover .cf-row__media img{transform:scale(1.03)}

.site--cafe .cf-menu{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:clamp(22px,3vw,38px);align-items:start}
.site--cafe .cf-item{grid-column:span 4;min-width:0}
.site--cafe .cf-item:nth-child(1){grid-column:1/5;margin-top:0}
.site--cafe .cf-item:nth-child(2){grid-column:5/9;margin-top:clamp(14px,4vw,60px)}
.site--cafe .cf-item:nth-child(3){grid-column:9/13;margin-top:clamp(22px,6.5vw,100px)}
.site--cafe .cf-item__fig{overflow:hidden;background:var(--paper2);aspect-ratio:3/4}
.site--cafe .cf-item__fig img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.site--cafe .cf-item:hover .cf-item__fig img{transform:scale(1.035)}
.site--cafe .cf-item__line{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:9px;border-top:1px solid var(--line2)}
.site--cafe .cf-item__name{font-family:var(--serif);font-size:17px;letter-spacing:-.02em}
.site--cafe .cf-item__dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.site--cafe .cf-item__price{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
.site--cafe .cf-item__desc{margin-top:8px;font-size:13px;line-height:1.75;color:var(--muted);text-wrap:pretty}
.site--cafe .cf-menu__foot{grid-column:1/13;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:clamp(26px,3vw,40px);padding-top:12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

.site--cafe .cf-quotes{border-top:1px solid var(--line2)}
.site--cafe .cf-quote{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:8px;padding:26px 0;border-bottom:1px solid var(--line2)}
.site--cafe .cf-quote__text{grid-column:2/9;font-family:var(--serif);font-size:clamp(16px,1.65vw,21px);line-height:1.62;letter-spacing:-.02em;text-wrap:pretty}
.site--cafe .cf-quote__who{grid-column:9/13;align-self:end;font-family:var(--mono);font-size:10px;letter-spacing:.08em;line-height:1.8;color:var(--muted);text-align:right}
.site--cafe .cf-quote:nth-child(2) .cf-quote__text{grid-column:4/11}
.site--cafe .cf-quote:nth-child(2) .cf-quote__who{grid-column:11/13}

.site--cafe .cf-visit{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:28px;align-items:start}
.site--cafe .cf-visit__info{grid-column:1/6}
.site--cafe .cf-visit__desc{font-size:14px;line-height:1.85;color:var(--muted);max-width:38ch;margin-bottom:22px;text-wrap:pretty}
.site--cafe .cf-dl{border-top:1px solid var(--line2)}
.site--cafe .cf-drow{display:grid;grid-template-columns:82px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.site--cafe .cf-drow dt{font-family:var(--mono);font-size:10px;letter-spacing:.11em;color:var(--muted);padding-top:3px}
.site--cafe .cf-drow dd{font-size:14px;line-height:1.6;color:var(--ink2)}
.site--cafe .cf-visit__acts{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap;align-items:center}
.site--cafe .cf-visit__media{grid-column:7/13;margin-right:calc(var(--bleed) * -1)}
.site--cafe .cf-visit__fig{aspect-ratio:16/10;overflow:hidden;background:var(--paper2)}
.site--cafe .cf-visit__fig img{width:100%;height:100%;object-fit:cover}
.site--cafe .cf-visit__cap{margin-top:10px;padding-top:9px;padding-right:var(--pad);border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}

.site--cafe .cf-foot{max-width:var(--maxw);margin:0 auto;padding:clamp(50px,6vw,80px) var(--pad) 30px;border-top:1px solid var(--line)}
.site--cafe .cf-foot__mark{font-family:var(--serif);font-size:clamp(36px,7.5vw,104px);line-height:.94;letter-spacing:-.04em}
.site--cafe .cf-foot__grid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:16px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line2);font-size:12px;line-height:1.75;color:var(--muted)}
.site--cafe .cf-foot__addr{grid-column:1/5}
.site--cafe .cf-foot__note{grid-column:5/9;font-size:11px}
.site--cafe .cf-foot__credit{grid-column:10/13;text-align:right;font-family:var(--mono);font-size:10px;letter-spacing:.09em;line-height:1.9}
.site--cafe .cf-foot__credit b{font-weight:400;color:var(--ink2)}
.site--cafe .cf-foot__credit a{border-bottom:1px solid var(--line2)}
.site--cafe .cf-foot__base{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:24px;padding-top:12px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

@media (max-width:1100px){
  .site--cafe .cf-bar__meta{display:none}
  .site--cafe .cf-hero__text{grid-column:1/7}
  .site--cafe .cf-hero__media{grid-column:7/13}
  .site--cafe .cf-head__desc{grid-column:8/13}
  .site--cafe .cf-row__body{grid-column:5/10}
  .site--cafe .cf-row__media{grid-column:10/13}
  .site--cafe .cf-row--wide .cf-row__body{grid-column:5/12}
}
@media (max-width:860px){
  .site--cafe .cf-bar{grid-template-columns:auto 1fr;gap:8px;padding:8px 10px;top:8px}
  .site--cafe .cf-mark__en{display:none}
  .site--cafe .sw{justify-self:end}
  .site--cafe .sw__t{padding:6px 8px;font-size:12px}
  .site--cafe .sw__t::after{left:8px;right:8px}
  .site--cafe .cf-issue{padding-top:76px}
  .site--cafe .cf-issue__in{flex-wrap:wrap;gap:6px 14px;font-size:8px}
  .site--cafe .cf-hero{grid-template-columns:1fr;padding-top:20px}
  .site--cafe .cf-hero__text,.site--cafe .cf-hero__media{grid-column:1/-1}
  .site--cafe .cf-hero__media{margin-top:34px;margin-right:calc(var(--pad) * -1)}
  .site--cafe .cf-cap{padding-right:var(--pad)}
  .site--cafe .cf-display{font-size:clamp(31px,8.2vw,43px);line-height:1.17}
  .site--cafe .cf-facts{grid-template-columns:1fr;gap:0;margin-top:30px}
  .site--cafe .cf-facts li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line2)}
  .site--cafe .cf-facts .v{margin-top:0;text-align:right}
  .site--cafe .cf-statement{grid-template-columns:1fr;row-gap:14px;padding-block:62px}
  .site--cafe .cf-statement__kick,.site--cafe .cf-statement__text{grid-column:1/-1}
  .site--cafe .cf-statement__text{font-size:clamp(23px,6.2vw,31px);max-width:none}
  .site--cafe .cf-head{grid-template-columns:1fr;row-gap:9px}
  .site--cafe .cf-head__no,.site--cafe .cf-head__title,.site--cafe .cf-head__desc{grid-column:1/-1}
  .site--cafe .cf-head__no{padding-bottom:0}
  .site--cafe .cf-row{grid-template-columns:1fr;row-gap:8px;padding:24px 0}

  .site--cafe .cf-item,.site--cafe .cf-item:nth-child(1),.site--cafe .cf-item:nth-child(2),.site--cafe .cf-item:nth-child(3){grid-column:1/-1;margin-top:0}
  .site--cafe .cf-item:nth-child(1) .cf-item__fig{aspect-ratio:4/5}

  .site--cafe .cf-visit{grid-template-columns:1fr}

/* =====================================================================
   02 · INTERIOR — dark construction studio, cinematic full bleed
   ===================================================================== */
.site--interior{
  --bg:#121417;--bg2:#171a1e;--panel:#1b1f24;--ink:#f2f0ec;--ink2:#c3c8cd;--muted:#8a9199;
  --line:rgba(242,240,236,.16);--line2:rgba(242,240,236,.08);--accent:#6ba398;--accent2:#25413c;
  --sans:"UI Sans",sans-serif;
  --pad:clamp(20px,4vw,72px);--gut:clamp(16px,2.4vw,40px);--maxw:1480px;
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.62;word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.005em
}
.site--interior strong{font-weight:600;color:var(--ink)}
.site--interior .in-bar{position:fixed;z-index:60;inset:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:16px var(--pad);color:#f2f0ec;border-bottom:1px solid transparent;transition:background .4s var(--ease),border-color .4s var(--ease),padding .4s var(--ease)}
.site--interior .in-bar.is-solid{background:rgba(18,20,23,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:var(--line2);padding-top:12px;padding-bottom:12px}
.site--interior .in-mark{display:flex;align-items:baseline;gap:11px;white-space:nowrap;font-size:16px;font-weight:700;letter-spacing:-.02em}
.site--interior .in-mark span{font-size:9px;font-weight:500;letter-spacing:.22em;color:var(--muted)}
.site--interior .sw{justify-self:center;gap:4px}
.site--interior .sw__t{padding:8px 12px;font-size:11px;font-weight:500;letter-spacing:.12em;color:#a9b0b7;border:1px solid transparent}
.site--interior .sw__t:hover{color:var(--ink)}
.site--interior .sw__t[aria-selected="true"]{color:var(--ink);border-color:rgba(107,163,152,.55);background:rgba(107,163,152,.10)}
.site--interior .sw__t[aria-selected="true"] .sw__no{color:var(--accent);opacity:1}
.site--interior .sw__no{font-size:9px;letter-spacing:.1em;opacity:.5}
.site--interior .sw__s{display:none}
.site--interior .in-bar__right{display:flex;align-items:center;gap:18px;white-space:nowrap}
.site--interior .in-tel{font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--ink2)}
.site--interior .in-tel:hover{color:var(--ink)}
.site--interior .in-cta{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;background:var(--accent);color:#0e1a18;font-size:12px;font-weight:600;letter-spacing:.02em;transition:background .3s var(--ease),transform .3s var(--ease)}
.site--interior .in-cta:hover{background:#82b9ae;transform:translateY(-1px)}
.site--interior .in-cta i{font-style:normal;font-size:13px}

.site--interior .in-hero{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:min(94svh,880px);padding:clamp(92px,10vw,124px) 0 clamp(24px,3.4vw,44px);overflow:hidden;background:#0d0f11}
.site--interior .in-hero__media{position:absolute;inset:0;overflow:hidden;z-index:0}
.site--interior .in-hero__media img,.site--interior .in-hero__media canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.site--interior .in-hero__media img{transform:scale(1.04);animation:in-breathe 26s ease-in-out infinite alternate}
.site--interior .in-hero__media canvas{opacity:0;transition:opacity .9s var(--ease)}
.site--interior .in-hero__media.is-live canvas{opacity:1}
@keyframes in-breathe{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.site--interior .in-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(13,15,17,.36) 0%,rgba(13,15,17,0) 22%,rgba(13,15,17,.06) 50%,rgba(13,15,17,.58) 82%,#121417 100%),linear-gradient(90deg,rgba(13,15,17,.34) 0%,rgba(13,15,17,.02) 38%,rgba(13,15,17,0) 58%)}
.site--interior .in-hero__top{position:relative;z-index:2;display:flex;justify-content:space-between;gap:20px;max-width:var(--maxw);width:100%;margin:0 auto clamp(28px,5vw,64px);padding:0 var(--pad);font-size:10px;font-weight:500;letter-spacing:.2em;color:#c6ccd1}
.site--interior .in-hero__body{position:relative;z-index:2;margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,300px);gap:clamp(24px,4vw,64px);align-items:end;max-width:var(--maxw);width:100%;margin:0 auto;padding:0 var(--pad)}
.site--interior .in-eyebrow{font-size:10px;font-weight:600;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;text-shadow:0 1px 18px rgba(13,15,17,.55)}
.site--interior .in-display{margin-top:16px;font-size:clamp(36px,6.2vw,86px);font-weight:700;line-height:.96;letter-spacing:-.045em;text-wrap:balance;text-shadow:0 2px 40px rgba(13,15,17,.5)}
.site--interior .in-display span{display:block}
.site--interior .in-display em{font-style:normal;color:var(--accent)}
.site--interior .in-lede{margin-top:22px;max-width:46ch;font-size:15px;line-height:1.8;color:#cdd2d6;text-wrap:pretty}
.site--interior .in-acts{display:flex;align-items:center;gap:18px;margin-top:28px;flex-wrap:wrap}
.site--interior .in-btn{display:inline-flex;align-items:center;gap:10px;padding:15px 22px;background:var(--ink);color:#121417;font-size:14px;font-weight:600;transition:background .3s var(--ease),transform .3s var(--ease)}
.site--interior .in-btn:hover{background:var(--accent);transform:translateY(-2px)}
.site--interior .in-btn i{font-style:normal;font-size:13px}
.site--interior .in-btn--ghost{background:transparent;color:var(--ink);border:1px solid rgba(242,240,236,.4)}

.site--interior .in-note a{color:var(--ink);border-bottom:1px solid rgba(242,240,236,.35)}
.site--interior .in-hero__side{border-left:1px solid rgba(242,240,236,.22);padding-left:clamp(16px,2vw,24px)}
.site--interior .in-hero__side dl{display:grid;gap:14px}
.site--interior .in-hero__side dt{font-size:9px;font-weight:500;letter-spacing:.2em;color:#8f979e}
.site--interior .in-hero__side dd{margin-top:3px;font-size:13px;line-height:1.5;color:var(--ink)}
.site--interior .in-scroll{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:9px;letter-spacing:.24em;color:#98a0a7}

.site--interior .in-strip span{display:block;margin-top:9px;font-size:10px;font-weight:500;letter-spacing:.17em;color:var(--muted);text-transform:uppercase}

.site--interior .in-sec{max-width:var(--maxw);margin:0 auto;padding:clamp(64px,8vw,116px) var(--pad)}
.site--interior .in-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:end;margin-bottom:clamp(32px,4.4vw,56px)}
.site--interior .in-head h2{font-size:clamp(27px,3.5vw,46px);font-weight:700;line-height:1.06;letter-spacing:-.038em;margin-top:14px;text-wrap:balance}
.site--interior .in-head p{font-size:14px;line-height:1.8;color:var(--muted);max-width:44ch;text-wrap:pretty}
.site--interior .in-head p strong{color:var(--ink2)}

.site--interior .in-timeline{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2.6vw,40px)}
.site--interior .in-timeline::before{content:"";position:absolute;top:6px;left:0;right:0;height:1px;background:rgba(242,240,236,.2)}

.site--interior .in-step:first-child::before{background:var(--accent)}
.site--interior .in-step__day{display:block;font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--accent)}
.site--interior .in-step h3{margin-top:8px;font-size:clamp(19px,2vw,25px);font-weight:700;letter-spacing:-.03em;line-height:1.24}
.site--interior .in-step p{margin-top:10px;font-size:13px;line-height:1.8;color:var(--muted);text-wrap:pretty}

.site--interior .in-spec{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad) clamp(64px,8vw,116px);display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(26px,4vw,64px);align-items:start}

.site--interior .in-spec__body > p{margin-top:14px;font-size:14px;line-height:1.85;color:var(--muted);max-width:42ch}
.site--interior .in-drow{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.site--interior .in-drow span{font-size:10px;font-weight:500;letter-spacing:.16em;color:var(--muted)}
.site--interior .in-drow b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.site--interior .in-spec__dl{margin-top:26px;border-top:1px solid var(--line2)}
.site--interior .in-includes{display:grid;gap:12px;margin-top:26px}
.site--interior .in-includes li{display:flex;gap:14px;font-size:13px;line-height:1.6;color:var(--ink2)}
.site--interior .in-includes b{flex:0 0 auto;font-size:10px;letter-spacing:.1em;color:var(--accent);padding-top:3px}
.site--interior .in-spec__cap{margin-top:14px;font-size:10px;letter-spacing:.14em;color:var(--muted)}

.site--interior .in-cases{border-top:1px solid var(--line2)}
.site--interior .in-cases__grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(16px,2.4vw,32px)}
.site--interior .in-case{min-width:0}
.site--interior .in-case--main{grid-column:1/8}
.site--interior .in-case--main .in-case__fig{aspect-ratio:16/10}
.site--interior .in-case--side{grid-column:8/13;display:grid;gap:clamp(16px,2.4vw,32px);align-content:space-between}
.site--interior .in-case--side .in-case__fig{aspect-ratio:4/3}
.site--interior .in-case__fig{overflow:hidden;background:#1b1f24}
.site--interior .in-case__fig img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.site--interior .in-case:hover .in-case__fig img{transform:scale(1.035)}
.site--interior .in-case__meta{display:flex;justify-content:space-between;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.site--interior .in-case h3{margin-top:10px;font-size:clamp(18px,1.9vw,24px);font-weight:700;letter-spacing:-.03em}
.site--interior .in-case p{margin-top:6px;font-size:13px;line-height:1.75;color:var(--muted);max-width:44ch}
.site--interior .in-case__price{margin-top:8px;font-size:12px;font-weight:600;color:var(--accent)}
.site--interior .in-stats{width:100%;border-top:1px solid var(--line);padding-top:14px}
.site--interior .in-stats__cap{font-size:10px;font-weight:500;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.site--interior .in-stats div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:15px 0;border-bottom:1px solid var(--line2)}
.site--interior .in-stats b{font-size:clamp(22px,2.6vw,32px);font-weight:700;letter-spacing:-.035em;color:var(--ink)}
.site--interior .in-stats span{font-size:10px;letter-spacing:.12em;color:var(--muted);text-align:right}
.site--interior .in-case__more{border-top:1px solid var(--line2);padding-top:18px}

.site--interior .in-voice__head{margin-bottom:clamp(24px,3.2vw,40px)}

.site--interior .in-guar{background:#17211f;border-top:1px solid rgba(107,163,152,.34);border-bottom:1px solid rgba(107,163,152,.2)}

.site--interior .in-guar__items{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,28px)}
.site--interior .in-guar__items div{padding-top:10px;border-top:1px solid rgba(107,163,152,.35)}
.site--interior .in-guar__items dt{font-size:9px;letter-spacing:.18em;color:#9db3ae}
.site--interior .in-guar__items dd{margin-top:5px;font-size:clamp(15px,1.5vw,18px);font-weight:600;letter-spacing:-.02em}
.site--interior .in-guar__acts{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px}

.site--interior .in-voice{max-width:var(--maxw);margin:0 auto;padding:clamp(64px,8vw,110px) var(--pad)}
.site--interior .in-voice__big{display:grid;grid-template-columns:minmax(0,9fr) minmax(0,3fr);gap:clamp(20px,3vw,48px);align-items:end;padding-bottom:clamp(26px,3.4vw,44px);border-bottom:1px solid var(--line)}
.site--interior .in-voice__big p{font-size:clamp(21px,2.9vw,38px);font-weight:600;line-height:1.36;letter-spacing:-.035em;text-wrap:pretty}
.site--interior .in-voice__big footer{font-size:11px;line-height:1.8;letter-spacing:.1em;color:var(--muted);text-align:right}
.site--interior .in-voice__small{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(22px,3vw,36px)}
.site--interior .in-voice__small p{font-size:14px;line-height:1.85;color:var(--ink2);text-wrap:pretty}
.site--interior .in-voice__small footer{margin-top:10px;font-size:10px;letter-spacing:.1em;color:var(--muted)}

.site--interior .in-foot{background:#0e1012;border-top:1px solid var(--line2)}
.site--interior .in-foot__in{max-width:var(--maxw);margin:0 auto;padding:clamp(48px,6vw,84px) var(--pad) 26px}
.site--interior .in-foot__cta{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:end}

.site--interior .in-foot__acts{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.site--interior .in-foot__acts .in-btn{padding:14px 20px}
.site--interior .in-foot__grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2.4vw,32px);margin-top:clamp(36px,5vw,64px);padding-top:22px;border-top:1px solid var(--line2)}
.site--interior .in-foot__grid dt{font-size:9px;letter-spacing:.18em;color:#7e868d}
.site--interior .in-foot__grid dd{margin-top:6px;font-size:13px;line-height:1.65;color:var(--ink2)}
.site--interior .in-foot__note{grid-column:1/-1;font-size:11px;line-height:1.7;color:#767e85;max-width:70ch}
.site--interior .in-foot__base{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px;padding-top:14px;border-top:1px solid var(--line2);font-size:9px;letter-spacing:.16em;color:#767e85;text-transform:uppercase}

@media (max-width:1120px){

}
@media (max-width:860px){

  .site--interior .in-timeline::before{display:none}
  .site--interior .in-step{padding:26px 0 26px 26px;border-top:1px solid var(--line2)}

          '<p class="cl-foot__mark" aria-hidden="true">' + d.markKo + '</p>' +
          '<div class="cl-foot__info">' +
            d.visit.rows.map(function(r){ return '<span>' + r[1] + '</span>'; }).join("") +
          '</div>' +
          '<p class="cl-foot__note">' + d.visit.note + '</p>' +
          '<p class="cl-foot__credit"><b>9.9만 원 원페이지 홈페이지 샘플</b> · 제작 문의 <a href="mailto:mashiaro@naver.com">mashiaro@naver.com</a></p>' +
          '<div class="cl-foot__base"><span>샘플 03 · ' + d.indName + '</span><span>© 2026 JD STUDIO</span></div>' +
        '</div>' +
      '</footer>' +
    '</div>';
  }

  var RENDER = {cafe: cafeHTML, interior: interiorHTML, clay: clayHTML};

  /* ---------------- reveals ---------------- */
  var io;
  function bindReveals(){
    if (reduce){
      Array.prototype.forEach.call(document.querySelectorAll("[data-rv]"), function(el){ el.classList.add("on"); });
      return;
    }
    if (io) io.disconnect();
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target); }
      });
    }, {rootMargin:"0px 0px -6% 0px", threshold:0.06});
    Array.prototype.forEach.call(document.querySelectorAll("[data-rv]"), function(el){ io.observe(el); });
  }

  function animateStatement(){
    var words = document.querySelectorAll(".cf-statement__text .w");
    if (!words.length) return;
    if (reduce){ Array.prototype.forEach.call(words, function(w){ w.classList.add("on"); }); return; }
    var so = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var i = Array.prototype.indexOf.call(words, e.target);
        e.target.style.transitionDelay = Math.min(i, 14) * 26 + "ms";
        e.target.classList.add("on");
        so.unobserve(e.target);
      });
    }, {rootMargin:"0px 0px -26% 0px"});
    Array.prototype.forEach.call(words, function(w){ so.observe(w); });
  }

  function bindSample(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-sample]"), function(b){
      b.addEventListener("click", function(){
        var n = document.getElementById("note");
        if (!n) return;
        var open = n.hidden;
        n.hidden = !open;
        if (open){ n.style.opacity = 0; requestAnimationFrame(function(){ n.style.opacity = 1; }); }
        live.textContent = "이 페이지는 9.9만 원 제작 샘플입니다. 제작 문의는 mashiaro@naver.com 입니다.";
      });
    });
  }

  /* ---------------- tabs ---------------- */
  function syncTabs(ind, focus){
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".sw__t"));
    tabs.forEach(function(t){
      var on = t.dataset.ind === ind;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
      t.addEventListener("click", function(){ select(t.dataset.ind, false); });
      t.addEventListener("keydown", function(e){
        var i = ORDER.indexOf(t.dataset.ind);
        if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
          e.preventDefault();
          var n = (i + (e.key === "ArrowRight" ? 1 : ORDER.length - 1)) % ORDER.length;
          select(ORDER[n], true);
        }
        if (e.key === "Home"){ e.preventDefault(); select(ORDER[0], true); }
        if (e.key === "End"){ e.preventDefault(); select(ORDER[ORDER.length - 1], true); }
      });
    });
  }

  function render(ind){
    var d = DATA[ind];
    app.innerHTML = RENDER[ind](d);
    document.title = d.title;
    if (metaDesc) metaDesc.setAttribute("content", d.desc);
    document.body.dataset.ind = ind;
    var mainEl = document.getElementById("main");
    if (mainEl) mainEl.setAttribute("aria-labelledby", "tab-" + ind);
    bindReveals();
    bindSample();
    animateStatement();
    if (GL) GL.mount(ind);
  }

  function select(ind, focus){
    if (!DATA[ind]) return;
    current = ind;
    render(ind);
    syncTabs(ind, focus);
    try {
      var url = new URL(window.location.href);
      url.searchParams.set("ind", ind);
      history.replaceState(null, "", url);
    } catch (e) { /* file:// 에서는 주소를 바꾸지 않습니다 */ }
    live.textContent = DATA[ind].label + " 샘플로 바뀌었습니다.";
    window.scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});
  }

  /* ---------------- dark bar state ---------------- */
  var barPending = false;
  function onScroll(){
    if (barPending) return;
    barPending = true;
    requestAnimationFrame(function(){
      barPending = false;
      var bar = document.getElementById("inBar");
      if (bar) bar.classList.toggle("is-solid", window.scrollY > 48);
    });
  }
  window.addEventListener("scroll", onScroll, {passive:true});

  /* ---------------- three.js photo plane ---------------- */
  var GLCFG = {
    cafe: {wave:.0022, grain:.016, drift:0, vig:.10, zoom:0},
    interior: {wave:.0014, grain:.010, drift:.0026, vig:.15, zoom:.035},
    clay: {wave:.0011, grain:.007, drift:.0008, vig:.07, zoom:.012}
  };

  var GL = (function(){
    var THREE = window.THREE;
    if (!THREE) return null;
    var canvas = document.createElement("canvas");
    canvas.id = "gl";
    canvas.setAttribute("aria-hidden", "true");
    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true, powerPreference:"low-power"});
    } catch (err) { return null; }
    renderer.setClearAlpha(0);

    var scene = new THREE.Scene();
    var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var uniforms = {
      uTex:{value:null}, uRes:{value:new THREE.Vector2(1,1)}, uImg:{value:new THREE.Vector2(1,1)},
      uTime:{value:0}, uMouse:{value:new THREE.Vector2(0,0)}, uAmp:{value:0}, uReveal:{value:0},
      uWave:{value:.0022}, uGrain:{value:.016}, uDrift:{value:0}, uVig:{value:.1}, uZoom:{value:0}
    };
    var mat = new THREE.ShaderMaterial({
      uniforms: uniforms,
      transparent: true,
      vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
      fragmentShader: [
        "precision highp float;",
        "varying vec2 vUv;",
        "uniform sampler2D uTex;",
        "uniform vec2 uRes;",
        "uniform vec2 uImg;",
        "uniform float uTime;",
        "uniform vec2 uMouse;",
        "uniform float uAmp;",
        "uniform float uReveal;",
        "uniform float uWave;",
        "uniform float uGrain;",
        "uniform float uDrift;",
        "uniform float uVig;",
        "uniform float uZoom;",
        "float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }",
        "void main(){",
        "  float ra = uRes.x / uRes.y;",
        "  float ia = uImg.x / uImg.y;",
        "  vec2 ratio = vec2(min(ra / ia, 1.0), min(ia / ra, 1.0));",
        "  vec2 uv = vec2(vUv.x * ratio.x + (1.0 - ratio.x) * 0.5, vUv.y * ratio.y + (1.0 - ratio.y) * 0.5);",
        "  float z = 1.0 - uZoom * (0.5 - 0.5 * cos(uTime * 0.14 + uReveal * 1.4));",
        "  uv = (uv - 0.5) * z + 0.5;",
        "  float w = sin(uv.y * 4.6 + uTime * 0.32) * uWave + sin(uv.x * 3.4 - uTime * 0.21) * uWave * 0.6;",
        "  uv.x += w + uMouse.x * 0.012 * uAmp;",
        "  uv.y += w * 0.5 + uMouse.y * 0.010 * uAmp + uDrift * sin(uTime * 0.2);",
        "  uv = (uv - 0.5) * (1.0 - 0.018 * uAmp - 0.004 * sin(uTime * 0.22) + 0.03 * uReveal) + 0.5;",
        "  vec3 col = texture2D(uTex, uv).rgb;",
        "  col += (hash(uv * uRes + uTime) - 0.5) * uGrain;",
        "  float d = distance(vUv, vec2(0.5));",
        "  col *= 1.0 - uVig * d * d * 1.9;",
        "  gl_FragColor = vec4(col, 1.0);",
        "}"
      ].join("\n")
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

    var loader = new THREE.TextureLoader();
    var curSrc = null, want = null, ready = false, wrapper = null, ro = null, ioBox = null;
    var mx = 0, my = 0, tx = 0, ty = 0, visible = true, last = 0;

    function resize(){
      if (!wrapper) return;
      var r = wrapper.getBoundingClientRect();
      var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);
      uniforms.uRes.value.set(Math.round(w * dpr), Math.round(h * dpr));
      if (ready) renderer.render(scene, camera);
    }

    function setPhoto(src){
      if (!src) return;
      want = src;
      loader.load(src, function(tex){
        if (want !== src) return;
        tex.minFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        uniforms.uTex.value = tex;
        uniforms.uImg.value.set(tex.image.width, tex.image.height);
        curSrc = src;
        uniforms.uReveal.value = 1.0;
        ready = true;
        resize();
        if (wrapper) wrapper.classList.add("is-live");
      }, undefined, function(){ /* 실패하면 배경 사진이 그대로 보입니다 */ });
    }

    function onMove(e){
      if (!wrapper) return;
      var r = wrapper.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width - 0.5;
      ty = (e.clientY - r.top) / r.height - 0.5;
    }
    function onLeave(){ tx = 0; ty = 0; }

    function mount(ind){
      var media = document.getElementById("heroMedia");
      if (!media) return;
      var cfg = GLCFG[ind] || GLCFG.cafe;
      uniforms.uWave.value = cfg.wave;
      uniforms.uGrain.value = cfg.grain;
      uniforms.uDrift.value = cfg.drift;
      uniforms.uVig.value = cfg.vig;
      uniforms.uZoom.value = cfg.zoom;

      if (wrapper !== media){
        if (wrapper){
          wrapper.removeEventListener("pointermove", onMove);
          wrapper.removeEventListener("pointerleave", onLeave);
        }
        wrapper = media;
        wrapper.appendChild(canvas);
        wrapper.addEventListener("pointermove", onMove, {passive:true});
        wrapper.addEventListener("pointerleave", onLeave);
        if (ro) ro.disconnect();
        if ("ResizeObserver" in window){
          ro = new ResizeObserver(resize);
          ro.observe(wrapper);
        }
        if (ioBox) ioBox.disconnect();
        if ("IntersectionObserver" in window){
          ioBox = new IntersectionObserver(function(es){ visible = es[0].isIntersecting; }, {threshold:0});
          ioBox.observe(wrapper);
        }
        if (ready) wrapper.classList.add("is-live");
      }
      resize();
      if (curSrc !== DATA[ind].hero.src) setPhoto(DATA[ind].hero.src);
    }

    document.addEventListener("visibilitychange", function(){ visible = !document.hidden; });
    window.addEventListener("resize", resize);

    function frame(t){
      requestAnimationFrame(frame);
      if (!visible || !ready) return;
      if (t - last < 30) return;
      last = t;
      mx += (tx - mx) * 0.05;
      my += (ty - my) * 0.05;
      uniforms.uMouse.value.set(mx, my);
      uniforms.uAmp.value += ((Math.abs(mx) + Math.abs(my) > 0.01 ? 1 : 0.35) - uniforms.uAmp.value) * 0.05;
      uniforms.uReveal.value *= 0.94;
      if (!reduce) uniforms.uTime.value += 0.033;
      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);

    window.__gl = {status:function(){ return {calls:renderer.info.render.calls, tex:curSrc, w:canvas.width, h:canvas.height}; }};
    return {mount:mount};
  })();

  /* ---------------- start ---------------- */
  var q = new URLSearchParams(window.location.search).get("ind");
  var start = ORDER.indexOf(q) >= 0 ? q : "cafe";
  current = start;
  render(start);
  syncTabs(start, false);
  onScroll();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();



</script>
</body>
</html>
