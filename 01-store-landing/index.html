<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원페이지 홈페이지 샘플 · 카페·식당 / 인테리어·설비 / 학원·공방</title>
<meta name="description" content="9.9만 원 원페이지 홈페이지 제작 샘플. 카페·식당, 인테리어·설비, 학원·공방 세 업종을 한 페이지에서 확인할 수 있습니다.">
<meta name="theme-color" content="#F4F0E7">
<meta property="og:type" content="website">
<meta property="og:title" content="원페이지 홈페이지 샘플 · 세 업종">
<meta property="og:description" content="카페·식당 / 인테리어·설비 / 학원·공방. 업종을 바꾸면 페이지 전체가 바뀝니다.">
<meta property="og:image" content="assets/cafe-hero.webp">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
@font-face{font-family:"Editorial Serif";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/serif-regular.woff2") format("woff2")}
@font-face{font-family:"UI Sans";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/sans-regular.woff2") format("woff2")}
@font-face{font-family:"UI Sans";font-style:normal;font-weight:500;font-display:swap;src:url("assets/fonts/sans-medium.woff2") format("woff2")}
@font-face{font-family:"UI Sans";font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/sans-semibold.woff2") format("woff2")}
@font-face{font-family:"Index Mono";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/mono-regular.woff2") format("woff2")}

:root{
  --paper:#F4F0E7;
  --paper-soft:#EDE7DB;
  --ink:#17140F;
  --ink-2:#3C372F;
  --muted:#6E6557;
  --line:rgba(23,20,15,.18);
  --line-soft:rgba(23,20,15,.10);
  --accent:#9A4E2B;
  --serif:"Editorial Serif","Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"UI Sans","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Index Mono","IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --pad:clamp(20px,4.4vw,64px);
  --gut:clamp(16px,2.2vw,32px);
  --maxw:1408px;
  --bleed:max(var(--pad), calc((100vw - var(--maxw)) / 2 + var(--pad)));
}
body[data-ind="interior"]{--paper:#EFEEE8;--paper-soft:#E5E4DC;--ink:#16150F;--ink-2:#3A3B33;--muted:#696A5E;--accent:#4E5B4A;--line:rgba(22,21,15,.18);--line-soft:rgba(22,21,15,.10)}
body[data-ind="clay"]{--paper:#F3EDE3;--paper-soft:#EAE2D4;--ink:#1A1510;--ink-2:#3E352C;--muted:#736455;--accent:#8A5A34;--line:rgba(26,21,16,.18);--line-soft:rgba(26,21,16,.10)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;overflow-x:clip;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;font-weight:400;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;transition:background-color .5s var(--ease),color .5s var(--ease)}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,p,figure,blockquote,dl,dd{margin:0}
ul{margin:0;padding:0;list-style:none}
figure{margin:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--paper);padding:12px 16px;z-index:100}
.skip:focus{left:16px;top:16px}

/* ---------- header ---------- */
.bar{position:fixed;z-index:50;top:14px;left:50%;transform:translateX(-50%);width:min(var(--maxw),calc(100% - 28px));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:10px 14px;border:1px solid var(--line-soft);background:rgba(244,240,231,.82);-webkit-backdrop-filter:blur(18px) saturate(1.05);backdrop-filter:blur(18px) saturate(1.05);transition:background .5s var(--ease),border-color .5s var(--ease)}
body[data-ind="interior"] .bar{background:rgba(239,238,232,.82)}
body[data-ind="clay"] .bar{background:rgba(243,237,227,.82)}
.mark{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.mark__ko{font-family:var(--serif);font-size:17px;letter-spacing:-.01em}
.mark__en{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;justify-self:center;align-items:stretch;gap:2px}
.tab{position:relative;display:flex;align-items:baseline;gap:8px;padding:8px 14px;background:none;border:0;cursor:pointer;color:var(--muted);transition:color .3s var(--ease)}
.tab::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tab__no{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted)}
.tab[aria-selected="true"] .tab__no{color:var(--accent)}
.tab__lb{font-size:13px;font-weight:500;letter-spacing:-.01em}
.tab__short{display:none;font-size:13px;font-weight:500;letter-spacing:-.01em}
.bar__meta{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.bar__meta b{font-weight:400;color:var(--ink)}
.bar__mail{text-decoration:none;border-bottom:1px solid var(--line-soft);padding-bottom:2px;transition:border-color .3s var(--ease)}
.bar__mail:hover{border-color:var(--ink)}

/* ---------- hero ---------- */
.hero{max-width:var(--maxw);margin:0 auto;padding:clamp(96px,12vw,150px) var(--pad) 0;display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);align-items:start}
.hero__text{grid-column:1/7;padding-top:6px}
.eyebrow{padding-top:12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);line-height:1.5}
.display{word-break:keep-all;font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.35vw,62px);line-height:1.14;letter-spacing:-.028em;margin-top:28px;text-wrap:balance}
.display span{display:block}
.display em{font-style:normal;color:var(--accent)}
.lede{margin-top:24px;max-width:44ch;color:var(--ink-2);font-size:15px;line-height:1.8;text-wrap:pretty}
.acts{display:flex;align-items:center;gap:24px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:12px;padding:14px 20px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font-size:14px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:transform .3s var(--ease),background .3s var(--ease),color .3s var(--ease)}
.btn:hover{transform:translateY(-2px);background:var(--accent);border-color:var(--accent);color:#F7F3EA}
.btn:active{transform:translateY(0) scale(.99)}
.btn__arw{font-family:var(--mono);font-size:11px;font-weight:400;opacity:.75}
.link{display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-bottom:1px solid var(--line);padding:2px 0;font-size:14px;font-weight:500;cursor:pointer;transition:color .3s var(--ease),border-color .3s var(--ease)}
.link:hover{color:var(--accent);border-color:var(--accent)}
.note{margin-top:18px;max-width:48ch;font-size:13px;line-height:1.75;color:var(--muted);padding-left:14px;border-left:1px solid var(--line);transition:opacity .4s var(--ease)}
.note strong{color:var(--ink-2);font-weight:500}
.note a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gut);margin-top:40px;padding-top:14px;border-top:1px solid var(--line)}
.facts li{min-width:0}
.facts dt,.facts .k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.facts .v{display:block;margin-top:6px;font-size:13px;line-height:1.45;color:var(--ink-2);letter-spacing:-.01em}

.hero__media{grid-column:7/13;margin-top:clamp(24px,5vw,80px);margin-right:calc(var(--bleed) * -1)}
.media{position:relative;aspect-ratio:4/3;background:var(--paper-soft);overflow:hidden}
.media img,.media canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media canvas{opacity:0;transition:opacity .8s var(--ease);z-index:1}
.media.is-live canvas{opacity:1}
.hero__cap{display:flex;justify-content:space-between;gap:16px;margin-top:12px;padding-top:10px;padding-right:var(--pad);border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);line-height:1.6}
.hero__cap span:last-child{text-align:right}

/* ---------- statement ---------- */
.statement{max-width:var(--maxw);margin:0 auto;padding:clamp(72px,10vw,140px) var(--pad);display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:24px}
.statement__kick{grid-column:1/4;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;padding-top:8px}
.statement__text{word-break:keep-all;grid-column:4/12;font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.5vw,48px);line-height:1.32;letter-spacing:-.025em;max-width:22ch;text-wrap:balance}
.statement__text .w{opacity:.16;transition:opacity .7s var(--ease)}
.statement__text .w.on{opacity:1}
.statement__text .br{display:block}

/* ---------- sections ---------- */
.sec{max-width:var(--maxw);margin:0 auto;padding:clamp(64px,7vw,96px) var(--pad);border-top:1px solid var(--line)}
.sec__head{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:16px;align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.sec__no{grid-column:1/2;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);padding-bottom:6px}
.sec__title{word-break:keep-all;grid-column:2/8;font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.9vw,40px);line-height:1.22;letter-spacing:-.025em;text-wrap:balance}
.sec__desc{grid-column:8/13;color:var(--muted);font-size:14px;line-height:1.75;max-width:46ch;text-wrap:pretty}

.rows{border-top:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:12px;padding:32px 0;border-bottom:1px solid var(--line-soft);align-items:start}
.row__no{grid-column:1/2;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);padding-top:5px}
.row__title{grid-column:2/5;font-family:var(--serif);font-size:clamp(19px,1.8vw,24px);line-height:1.35;letter-spacing:-.02em}
.row__body{grid-column:5/9;font-size:14px;line-height:1.8;color:var(--ink-2);text-wrap:pretty}
.row__body strong{font-weight:500;color:var(--ink)}
.row__media{grid-column:9/13;aspect-ratio:4/3;overflow:hidden;background:var(--paper-soft);margin-top:-8px}
.row__media img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.row:hover .row__media img{transform:scale(1.03)}

.work{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:clamp(24px,3vw,40px);align-items:start}
.item{min-width:0}
.item__fig{overflow:hidden;background:var(--paper-soft)}
.item__fig img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.item:hover .item__fig img{transform:scale(1.035)}
.item__cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.item__name{font-family:var(--serif);font-size:17px;letter-spacing:-.02em;word-break:keep-all}
.item:nth-child(2) .item__cap,.item:nth-child(3) .item__cap{flex-direction:column;align-items:flex-start;gap:2px}
.item:nth-child(2) .item__meta,.item:nth-child(3) .item__meta{white-space:normal}
.item__meta{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.item__desc{margin-top:6px;font-size:13px;line-height:1.7;color:var(--muted);max-width:38ch;text-wrap:pretty}
.item:nth-child(1){grid-column:1/6}
.item:nth-child(1) .item__fig{aspect-ratio:4/5}
.item:nth-child(2){grid-column:7/10;margin-top:clamp(16px,6vw,88px)}
.item:nth-child(2) .item__fig{aspect-ratio:3/4}
.item:nth-child(3){grid-column:10/13;margin-top:clamp(24px,9vw,140px)}
.item:nth-child(3) .item__fig{aspect-ratio:1/1}

.quotes{border-top:1px solid var(--line-soft)}
.quote{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:8px;padding:28px 0;border-bottom:1px solid var(--line-soft)}
.quote__text{grid-column:2/9;font-family:var(--serif);font-size:clamp(17px,1.7vw,22px);line-height:1.6;letter-spacing:-.02em;color:var(--ink);text-wrap:pretty}
.quote__who{grid-column:9/13;align-self:end;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);line-height:1.8;text-align:right}
.quote:nth-child(2) .quote__text{grid-column:4/11}
.quote:nth-child(2) .quote__who{grid-column:11/13}

.visit{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:32px;align-items:start}
.visit__info{grid-column:1/6}
.visit__desc{font-size:14px;line-height:1.8;color:var(--muted);max-width:40ch;margin-bottom:24px;text-wrap:pretty}
.visit dl{border-top:1px solid var(--line-soft)}
.visit .drow{display:grid;grid-template-columns:88px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.visit .drow dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);padding-top:3px}
.visit .drow dd{font-size:14px;line-height:1.6;color:var(--ink-2)}
.visit__acts{display:flex;gap:24px;margin-top:24px;flex-wrap:wrap}
.visit__media{grid-column:7/13;margin-right:calc(var(--bleed) * -1)}
.visit__fig{aspect-ratio:16/10;overflow:hidden;background:var(--paper-soft)}
.visit__fig img{width:100%;height:100%;object-fit:cover}
.visit__cap{margin-top:10px;padding-top:10px;padding-right:var(--pad);border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}

/* ---------- footer ---------- */
.foot{max-width:var(--maxw);margin:0 auto;padding:clamp(56px,7vw,88px) var(--pad) 32px;border-top:1px solid var(--line)}
.foot__mark{font-family:var(--serif);font-size:clamp(38px,8vw,112px);line-height:.92;letter-spacing:-.035em;overflow:hidden}
.foot__mark span{display:block}
.foot__grid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut);row-gap:20px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line-soft);font-size:12px;line-height:1.7;color:var(--muted)}
.foot__addr{grid-column:1/5}
.foot__note{grid-column:5/9;font-size:11px}
.foot__credit{grid-column:10/13;text-align:right;font-family:var(--mono);font-size:10px;letter-spacing:.1em;line-height:1.9}
.foot__credit b{font-weight:400;color:var(--ink-2)}
.foot__credit a{text-decoration:none;border-bottom:1px solid var(--line-soft);color:var(--ink-2)}
.foot__credit a:hover{border-color:var(--ink)}
.foot__base{display:flex;justify-content:space-between;gap:16px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;flex-wrap:wrap}

[data-rv]{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
[data-rv].on{opacity:1;transform:none}

@media (max-width:1080px){
  .bar__meta{display:none}
  .hero__text{grid-column:1/8}
  .hero__media{grid-column:8/13}
  .sec__desc{grid-column:8/13}
  .row__body{grid-column:5/10}
  .row__media{grid-column:10/13}
}
@media (max-width:820px){
  .bar{grid-template-columns:auto 1fr;gap:8px;padding:8px 10px;top:8px}
  .mark__en{display:none}
  .tabs{justify-self:end;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:7px 9px}
  .tab::after{left:9px;right:9px}
  .tab__lb{font-size:12px}
  .hero{grid-template-columns:1fr;padding-top:104px}
  .hero__text,.hero__media{grid-column:1/-1}
  .hero__media{margin-top:40px;margin-right:calc(var(--pad) * -1)}
  .hero__cap{padding-right:var(--pad)}
  .visit__cap{padding-right:0}
  .display{font-size:clamp(32px,8.4vw,44px);line-height:1.16}
  .facts{grid-template-columns:1fr;gap:0;margin-top:32px}
  .facts li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .facts .v{margin-top:0;text-align:right}
  .statement{grid-template-columns:1fr;padding-block:64px}
  .statement__kick,.statement__text{grid-column:1/-1}
  .statement__text{font-size:clamp(24px,6.4vw,32px);max-width:none}
  .sec__head{grid-template-columns:1fr;row-gap:10px}
  .sec__no,.sec__title,.sec__desc{grid-column:1/-1}
  .sec__no{padding-bottom:0}
  .row{grid-template-columns:1fr;row-gap:8px;padding:26px 0}
  .row__no,.row__title,.row__body,.row__media{grid-column:1/-1}
  .row__media{margin-top:16px;aspect-ratio:16/10}
  .work{grid-template-columns:1fr}
  .item:nth-child(1),.item:nth-child(2),.item:nth-child(3){grid-column:1/-1;margin-top:0}
  .item:nth-child(1) .item__fig{aspect-ratio:4/5}
  .item:nth-child(2) .item__fig{aspect-ratio:4/3}
  .item:nth-child(3) .item__fig{aspect-ratio:1/1}
  .item__cap{flex-direction:column;align-items:flex-start;gap:2px}
  .item__meta{white-space:normal}
  .quote{grid-template-columns:1fr;row-gap:10px}
  .quote__text,.quote:nth-child(2) .quote__text,.quote__who,.quote:nth-child(2) .quote__who{grid-column:1/-1;text-align:left}
  .visit{grid-template-columns:1fr}
  .visit__info,.visit__media{grid-column:1/-1}
  .visit__media{margin-right:0}
  .foot__addr,.foot__note,.foot__credit{grid-column:1/-1;text-align:left}
  .foot__grid{margin-top:28px}
}
@media (max-width:480px){
  .tab{padding:7px 7px;gap:5px}
  .tab::after{left:7px;right:7px}
  .tab__lb{display:none}
  .tab__short{display:inline}
  .mark__ko{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  [data-rv]{opacity:1;transform:none;transition:none}
  .statement__text .w{opacity:1;transition:none}
  .media canvas{transition:none}
  .btn:hover{transform:none}
  .item:hover .item__fig img,.row:hover .row__media img{transform:none}
}
</style>
</head>
<body data-ind="cafe">
<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="bar">
  <a class="mark" href="#top" aria-label="샘플 홈으로">
    <span class="mark__ko" id="markKo">온기커피</span>
    <span class="mark__en" id="markEn">ONGGI COFFEE</span>
  </a>
  <nav class="tabs" role="tablist" aria-label="업종 선택">
    <button class="tab" role="tab" id="tab-cafe" data-ind="cafe" aria-selected="true" aria-controls="main" tabindex="0"><span class="tab__no">01</span><span class="tab__lb">카페·식당</span><span class="tab__short">카페</span></button>
    <button class="tab" role="tab" id="tab-interior" data-ind="interior" aria-selected="false" aria-controls="main" tabindex="-1"><span class="tab__no">02</span><span class="tab__lb">인테리어·설비</span><span class="tab__short">인테리어</span></button>

        ],
        img: "assets/clay-studio.webp", alt: "물레와 작업대가 놓인 조용한 도예공방 내부",
        cap: "물레 4대 · 손성형 테이블 6석 · 가마 1기",
        acts: ["전화하기", "클래스 예약", "카카오톡 문의"]

  var ORDER = ["cafe", "interior", "clay"];
  var app = document.getElementById("app");
  var live = document.getElementById("live");
  var current = "cafe";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function esc(s){ return s; }

  function heroCaption(d){

  }

  function render(ind){

        '<p class="row__body">' + r.body + '</p>' +

      '</div>';
    }).join("");

    var items = d.work.items.map(function(it){
      return '<figure class="item" data-rv>' +
        '<div class="item__fig"><img src="' + it.img + '" alt="' + it.alt + '" loading="lazy" decoding="async"></div>' +
        '<figcaption class="item__cap"><span class="item__name">' + it.name + '</span><span class="item__meta">' + it.meta + '</span></figcaption>' +
        '<p class="item__desc">' + it.desc + '</p>' +

    }).join("");

    var quotes = d.voice.quotes.map(function(q){

    var drows = d.visit.rows.map(function(r){
      return '<div class="drow"><dt>' + r.k + '</dt><dd>' + r.v + '</dd></div>';

    var vacts = d.visit.acts.map(function(a, i){
      return i === 0

    }).join("");

    var words = d.statement.text.split("|").map(function(line){
      return line.split(" ").map(function(w){
        return '<span class="w">' + w + '</span>';

    }).join('<span class="br"></span>');

    app.innerHTML =
      '<section class="hero">' +
        '<div class="hero__text">' +
          '<p class="eyebrow">' + d.eyebrow + '</p>' +
          '<h1 class="display">' + d.h1.map(function(l){ return '<span>' + l + '</span>'; }).join("") + '</h1>' +
          '<p class="lede">' + d.lede + '</p>' +
          '<div class="acts">' +
            '<button class="btn" data-sample>' + d.cta.primary + '<span class="btn__arw" aria-hidden="true">→</span></button>' +
            '<button class="link" data-sample>' + d.cta.secondary + '</button>' +
          '</div>' +
          '<p class="note" id="note" hidden>이 페이지는 <strong>9.9만 원 샘플</strong>입니다. 실제 납품 시 이 버튼은 매장의 예약·전화·카카오톡 채널로 연결됩니다. 제작 문의 <a href="mailto:mashiaro@naver.com">mashiaro@naver.com</a></p>' +
          '<ul class="facts">' + d.facts.map(function(f){ return '<li><span class="k">' + f.k + '</span><span class="v">' + f.v + '</span></li>'; }).join("") + '</ul>' +
        '</div>' +
        '<figure class="hero__media" data-rv>' +
          '<div class="media" id="media">' +
            '<img id="heroImg" src="' + d.hero.src + '" alt="' + d.hero.alt + '">' +
          '</div>' +
          heroCaption(d) +
        '</figure>' +
      '</section>' +

      '<section class="statement" aria-label="브랜드 문장">' +
        '<p class="statement__kick">' + d.statement.kick + '</p>' +
        '<p class="statement__text">' + words + '</p>' +
      '</section>' +

      '<section class="sec">' +
        '<header class="sec__head">' +
          '<span class="sec__no">' + d.principle.no + '</span>' +
          '<h2 class="sec__title">' + d.principle.title + '</h2>' +
          '<p class="sec__desc">' + d.principle.desc + '</p>' +
        '</header>' +
        '<div class="rows">' + rows + '</div>' +
      '</section>' +

      '<section class="sec">' +
        '<header class="sec__head">' +
          '<span class="sec__no">' + d.work.no + '</span>' +
          '<h2 class="sec__title">' + d.work.title + '</h2>' +
          '<p class="sec__desc">' + d.work.desc + '</p>' +
        '</header>' +
        '<div class="work">' + items + '</div>' +
      '</section>' +

      '<section class="sec">' +
        '<header class="sec__head">' +
          '<span class="sec__no">' + d.voice.no + '</span>' +
          '<h2 class="sec__title">' + d.voice.title + '</h2>' +
        '</header>' +
        '<div class="quotes">' + quotes + '</div>' +
      '</section>' +

      '<section class="sec">' +
        '<header class="sec__head">' +
          '<span class="sec__no">' + d.visit.no + '</span>' +
          '<h2 class="sec__title">' + d.visit.title + '</h2>' +
        '</header>' +
        '<div class="visit">' +
          '<div class="visit__info">' +
            '<p class="visit__desc">' + d.visit.desc + '</p>' +
            '<dl>' + drows + '</dl>' +
            '<div class="visit__acts">' + vacts + '</div>' +
          '</div>' +
          '<figure class="visit__media" data-rv>' +
            '<div class="visit__fig"><img src="' + d.visit.img + '" alt="' + d.visit.alt + '" loading="lazy" decoding="async"></div>' +
            '<figcaption class="visit__cap">' + d.visit.cap + '</figcaption>' +
          '</figure>' +
        '</div>' +
      '</section>';

    document.title = d.title;
    document.querySelector('meta[name="description"]').setAttribute("content", d.desc);
    document.getElementById("markKo").textContent = d.markKo;
    document.getElementById("markEn").textContent = d.markEn;
    document.getElementById("footMark").textContent = d.markKo;
    document.getElementById("footAddr").textContent = d.footAddr;
    document.getElementById("footNote").textContent = d.footNote;
    document.getElementById("indName").textContent = d.indName;
    document.body.dataset.ind = ind;
    var mainEl = document.getElementById("main");
    if (mainEl) mainEl.setAttribute("aria-labelledby", "tab-" + ind);

    bindReveals();
    bindSample();
    animateStatement();
    if (window.__gl) window.__gl.mount(d.hero.src);
  }

  /* ---------- reveals ---------- */
  var io;
  function bindReveals(){
    if (reduce){ document.querySelectorAll("[data-rv]").forEach(function(el){ el.classList.add("on"); }); return; }
    if (io) io.disconnect();
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target); }
      });
    }, {rootMargin:"0px 0px -8% 0px", threshold:0.08});
    document.querySelectorAll("[data-rv]").forEach(function(el){ io.observe(el); });
  }

  function animateStatement(){
    var words = document.querySelectorAll(".statement__text .w");
    if (!words.length) return;
    if (reduce) { words.forEach(function(w){ w.classList.add("on"); }); return; }
    var so = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var i = Array.prototype.indexOf.call(words, e.target);
        e.target.style.transitionDelay = Math.min(i, 12) * 28 + "ms";
        e.target.classList.add("on");
        so.unobserve(e.target);
      });
    }, {rootMargin:"0px 0px -30% 0px"});
    words.forEach(function(w){ so.observe(w); });
  }

  /* ---------- sample note ---------- */
  function bindSample(){
    document.querySelectorAll("[data-sample]").forEach(function(b){
      b.addEventListener("click", function(){
        var n = document.getElementById("note");
        if (!n) return;
        var open = n.hidden;
        n.hidden = !open;
        if (open){ n.style.opacity = 0; requestAnimationFrame(function(){ n.style.opacity = 1; }); }
        live.textContent = "이 페이지는 9.9만 원 제작 샘플입니다. 제작 문의는 mashiaro@naver.com 입니다.";
      });
    });
  }

  /* ---------- tabs ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  function select(ind, focus){
    if (!DATA[ind]) return;
    current = ind;
    tabs.forEach(function(t){
      var on = t.dataset.ind === ind;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    });
    render(ind);
    try {
      var url = new URL(window.location.href);
      url.searchParams.set("ind", ind);
      history.replaceState(null, "", url);
    } catch (e) { /* file:// 에서는 주소를 바꾸지 않습니다 */ }
    live.textContent = DATA[ind].label + " 샘플로 바뀌었습니다.";
    window.scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});
  }
  tabs.forEach(function(t){
    t.addEventListener("click", function(){ select(t.dataset.ind, false); });
    t.addEventListener("keydown", function(e){
      var i = ORDER.indexOf(t.dataset.ind);
      if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
        e.preventDefault();
        var n = (i + (e.key === "ArrowRight" ? 1 : ORDER.length - 1)) % ORDER.length;
        select(ORDER[n], true);
      }
      if (e.key === "Home"){ e.preventDefault(); select(ORDER[0], true); }
      if (e.key === "End"){ e.preventDefault(); select(ORDER[ORDER.length - 1], true); }
    });
  });

  /* ---------- start ---------- */
  var q = new URLSearchParams(window.location.search).get("ind");
  var start = ORDER.indexOf(q) >= 0 ? q : "cafe";
  current = start;
  render(start);
  tabs.forEach(function(t){
    var on = t.dataset.ind === start;
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
  });

  /* ---------- three.js photo plane ---------- */
  (function(){
    var THREE = window.THREE;
    if (!THREE) return;
    var canvas = document.createElement("canvas");
    canvas.id = "gl";
    canvas.setAttribute("aria-hidden", "true");
    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true, powerPreference:"low-power"});
    } catch (err) { return; }
    renderer.setClearAlpha(0);

    var scene = new THREE.Scene();
    var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var uniforms = {
      uTex:{value:null},
      uRes:{value:new THREE.Vector2(1,1)},
      uImg:{value:new THREE.Vector2(1,1)},
      uTime:{value:0},
      uMouse:{value:new THREE.Vector2(0,0)},
      uAmp:{value:0},
      uReveal:{value:0}
    };
    var mat = new THREE.ShaderMaterial({
      uniforms: uniforms,
      transparent: true,
      vertexShader: [
        "varying vec2 vUv;",
        "void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }"
      ].join("\n"),
      fragmentShader: [
        "precision highp float;",
        "varying vec2 vUv;",
        "uniform sampler2D uTex;",
        "uniform vec2 uRes;",
        "uniform vec2 uImg;",
        "uniform float uTime;",
        "uniform vec2 uMouse;",
        "uniform float uAmp;",
        "uniform float uReveal;",
        "void main(){",
        "  float ra = uRes.x / uRes.y;",
        "  float ia = uImg.x / uImg.y;",
        "  vec2 ratio = vec2(min(ra / ia, 1.0), min(ia / ra, 1.0));",
        "  vec2 uv = vec2(vUv.x * ratio.x + (1.0 - ratio.x) * 0.5, vUv.y * ratio.y + (1.0 - ratio.y) * 0.5);",
        "  float wave = sin(uv.y * 4.6 + uTime * 0.32) * 0.0022 + sin(uv.x * 3.4 - uTime * 0.21) * 0.0014;",
        "  uv.x += wave + uMouse.x * 0.012 * uAmp;",
        "  uv.y += wave * 0.5 + uMouse.y * 0.010 * uAmp;",
        "  uv = (uv - 0.5) * (1.0 - 0.018 * uAmp - 0.006 * sin(uTime * 0.22) + 0.035 * uReveal) + 0.5;",
        "  vec3 col = texture2D(uTex, uv).rgb;",
        "  float g = fract(sin(dot(uv * uRes, vec2(12.9898, 78.233))) * 43758.5453);",
        "  col += (g - 0.5) * 0.016;",
        "  gl_FragColor = vec4(col, 1.0);",
        "}"
      ].join("\n")
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

    var loader = new THREE.TextureLoader();
    var curSrc = null, want = null, ready = false;
    var wrapper = null, ro = null, ioBox = null, mx = 0, my = 0, tx = 0, ty = 0, amp = 0;
    var visible = true, last = 0;

    function resize(){
      if (!wrapper) return;
      var r = wrapper.getBoundingClientRect();
      var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);
      uniforms.uRes.value.set(Math.round(w * dpr), Math.round(h * dpr));
      if (ready) renderer.render(scene, camera);
    }

    function setPhoto(src){
      if (!src) return;
      want = src;
      loader.load(src, function(tex){
        if (want !== src) return;
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        uniforms.uTex.value = tex;
        uniforms.uImg.value.set(tex.image.width, tex.image.height);
        curSrc = src;
        uniforms.uReveal.value = 1.0;
        ready = true;
        resize();
        if (wrapper) wrapper.classList.add("is-live");
      }, undefined, function(){ /* 실패하면 배경 사진이 그대로 보입니다 */ });
    }

    function onMove(e){
      if (!wrapper) return;
      var r = wrapper.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width - 0.5;
      ty = (e.clientY - r.top) / r.height - 0.5;
      amp = 1;
    }
    function onLeave(){ tx = 0; ty = 0; amp = 0.35; }

    function mount(src){
      var media = document.getElementById("media");
      if (!media) return;
      if (wrapper !== media){
        if (wrapper){
          wrapper.removeEventListener("pointermove", onMove);
          wrapper.removeEventListener("pointerleave", onLeave);
        }
        wrapper = media;
        wrapper.appendChild(canvas);
        wrapper.addEventListener("pointermove", onMove, {passive:true});
        wrapper.addEventListener("pointerleave", onLeave);
        if (ro) ro.disconnect();
        if ("ResizeObserver" in window){
          ro = new ResizeObserver(resize);
          ro.observe(wrapper);
        }
        if (ioBox) ioBox.disconnect();
        if ("IntersectionObserver" in window){
          ioBox = new IntersectionObserver(function(es){ visible = es[0].isIntersecting; }, {threshold:0});
          ioBox.observe(wrapper);
        }
        if (ready) wrapper.classList.add("is-live");
      }
      resize();
      if (curSrc !== src) setPhoto(src);
    }

    document.addEventListener("visibilitychange", function(){ visible = !document.hidden; });
    window.addEventListener("resize", resize);

    function frame(t){
      requestAnimationFrame(frame);
      if (!visible || !ready) return;
      if (t - last < 16.7) return;
      last = t;
      mx += (tx - mx) * 0.06;
      my += (ty - my) * 0.06;
      uniforms.uMouse.value.set(mx, my);
      uniforms.uAmp.value += (1 - uniforms.uAmp.value) * 0.04;
      uniforms.uReveal.value *= 0.93;
      if (!reduce) uniforms.uTime.value += 0.016;
      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);

    window.__gl = {mount:mount, setPhoto:setPhoto, status:function(){ return {calls:renderer.info.render.calls, tex:curSrc, w:canvas.width, h:canvas.height}; }};
    mount(DATA[current].hero.src);
  })();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
